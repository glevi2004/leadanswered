<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Answered</title>
    <meta name="description" content="Answered — AI lead response for home-service contractors." />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
    <meta name="theme-color" content="#dde2ee" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-900: #0c1747;
        --ink-800: #1c1d22;
        --muted: #5e616e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: var(--ink-800);
        background: linear-gradient(180deg, #dde2ee 0%, #f4f6fb 44%, #ffffff 100%);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
      }
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .mark { width: 62px; height: auto; display: block; }
      .wordmark {
        margin-top: 18px;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: -0.02em;
        color: var(--ink-900);
      }

      /* Primary button — verbatim from the original landing page */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(180deg, #80b5ff 0%, #3388ff 97%);
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 10px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.3) inset,
          0 1px 2px rgba(12, 23, 71, 0.08),
          0 2px 8px rgba(49, 82, 244, 0.18);
        transition: all 0.18s ease;
        border: 1px solid #1b73ee;
        line-height: 1.2;
      }
      .btn-primary:hover {
        background: linear-gradient(180deg, #529aff 0%, #1b73ee 97%);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.3) inset,
          0 1px 2px rgba(12, 23, 71, 0.1),
          0 4px 14px rgba(49, 82, 244, 0.32);
      }
      .btn-primary-lg { font-size: 15px; padding: 12px 22px; border-radius: 12px; }
      .btn-primary svg { width: 16px; height: 16px; flex-shrink: 0; }
      .stage .btn-primary { margin-top: 34px; }

      /* Pre-hydration fallback for the flip text (React replaces the button on load) */
      .flip-text { display: inline-grid; place-items: center; }
      .flip-text-face {
        grid-area: 1 / 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .flip-text-face-back { opacity: 0; }

      footer { padding: 22px; text-align: center; font-size: 12.5px; color: var(--muted); }
      footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
      footer a:hover { color: var(--ink-800); text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="stage">
      <img class="mark" src="./logo.png" alt="Answered" />
      <div class="wordmark">Answered</div>
      <a class="btn-primary btn-primary-lg" href="https://cal.com/leviramos">
        <span class="flip-text">
          <span class="flip-text-face flip-text-face-front">Schedule a 15-minute call</span>
          <span class="flip-text-face flip-text-face-back">Schedule a 15-minute call</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path
            d="M3 8h10m0 0L9 4m4 4l-4 4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </main>
    <footer>
      <a href="./privacy">Privacy</a>·<a href="./terms">Terms</a>
    </footer>

    <!-- Flip-button animation — the EXACT same React + framer-motion implementation
         as the original landing page (same variants, same spring transition). -->
    <script type="module">
      import React from "https://esm.sh/react@19";
      import { createRoot } from "https://esm.sh/react-dom@19/client";
      import { motion } from "https://esm.sh/framer-motion@12?deps=react@19,react-dom@19";

      const h = React.createElement;
      const transition = { type: "spring", stiffness: 280, damping: 20 };

      const frontVariants = {
        initial: { opacity: 1, rotateX: 0, y: "0%" },
        hover: { opacity: 0, rotateX: 90, y: "50%" },
      };
      const backVariants = {
        initial: { opacity: 0, rotateX: 90, y: "-50%" },
        hover: { opacity: 1, rotateX: 0, y: "0%" },
      };

      const arrowPath = "M3 8h10m0 0L9 4m4 4l-4 4";

      function FlipPrimaryButton({ href, text, className }) {
        const isLarge = className.includes("btn-primary-lg");
        const iconSize = isLarge ? 16 : 14;

        return h(
          motion.a,
          {
            href,
            className,
            initial: "initial",
            whileHover: "hover",
            whileTap: { scale: 0.95 },
            transition,
          },
          h(
            "span",
            { style: { display: "inline-grid", placeItems: "center", perspective: "1000px" } },
            h(
              motion.span,
              {
                variants: frontVariants,
                transition,
                style: { gridArea: "1 / 1", display: "inline-flex", alignItems: "center", justifyContent: "center" },
              },
              text,
            ),
            h(
              motion.span,
              {
                variants: backVariants,
                transition,
                style: { gridArea: "1 / 1", display: "inline-flex", alignItems: "center", justifyContent: "center" },
              },
              text,
            ),
          ),
          h(
            "svg",
            { width: iconSize, height: iconSize, viewBox: "0 0 16 16", fill: "none", style: { width: iconSize + "px", height: iconSize + "px" } },
            h("path", { d: arrowPath, stroke: "currentColor", strokeWidth: 1.6, strokeLinecap: "round", strokeLinejoin: "round" }),
          ),
        );
      }

      document.querySelectorAll("a.btn-primary").forEach((btn) => {
        const href = btn.getAttribute("href") || "#";
        const className = btn.className;
        const frontEl = btn.querySelector(".flip-text-face-front");
        const text = frontEl ? frontEl.textContent.trim() : btn.textContent.trim();

        const container = document.createElement("span");
        container.style.display = "inline-flex";
        btn.parentNode.insertBefore(container, btn);
        btn.remove();

        createRoot(container).render(h(FlipPrimaryButton, { href, text, className }));
      });
    </script>
  </body>
</html>
