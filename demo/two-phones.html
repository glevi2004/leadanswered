<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lead Answered — two-phone demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    /* Landing page hero wash — soft green fading to white */
    background: linear-gradient(180deg, #e7f4ec 0%, #f1f7f3 48%, #ffffff 100%);
  }
  .stage { display: flex; align-items: flex-start; gap: 72px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 15px; }
  .caption { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #5b6171; text-transform: uppercase; }

  .phone { width: 372px; height: 760px; background: #fff; border-radius: 46px;
    box-shadow: 0 30px 80px rgba(16,24,40,.22); overflow: hidden; display: flex; flex-direction: column;
    border: 10px solid #0d0f12;
    font-family: -apple-system, "SF Pro Text", system-ui, "Inter", sans-serif; }
  .hdr { text-align: center; padding: 13px 0 11px; border-bottom: 1px solid #e9e9eb; flex: 0 0 auto; }
  .hdr .av { width: 46px; height: 46px; border-radius: 50%; margin: 4px auto 5px;
    background: linear-gradient(135deg, #22b94a 0%, #30d158 100%); color: #fff; font-weight: 700; font-size: 19px;
    display: flex; align-items: center; justify-content: center; }
  .hdr .nm { font-size: 13px; color: #1b1b1f; font-weight: 600; }
  .thread { flex: 1; overflow-y: auto; padding: 16px 12px 14px; display: flex; flex-direction: column; gap: 2px; background: #fff; }
  .thread::-webkit-scrollbar { display: none; }

  .sys { align-self: center; color: #8e8e93; font-size: 12px; font-weight: 600; margin: 10px 0 6px; }
  .row { display: flex; }
  .row.them { justify-content: flex-start; }
  .row.me { justify-content: flex-end; }
  .msg { position: relative; max-width: 78%; padding: 7px 13px 8px; border-radius: 18px;
    font-size: 15px; line-height: 1.34; word-wrap: break-word; white-space: pre-wrap; margin: 3px 4px;
    opacity: 0; transform: translateY(7px); transition: opacity .2s ease, transform .2s ease; }
  .msg.in { opacity: 1; transform: none; }
  .msg-them { background: #e9e9eb; color: #1b1b1f; }
  .msg-me { background: #34c759; color: #fff; }
  .msg-them::before { content:""; position:absolute; z-index:0; bottom:0; left:-7px; height:19px; width:19px; background:#e9e9eb; border-bottom-right-radius:16px; }
  .msg-them::after  { content:""; position:absolute; z-index:1; bottom:0; left:-11px; height:19px; width:11px; background:#fff; border-bottom-right-radius:11px; }
  .msg-me::before   { content:""; position:absolute; z-index:0; bottom:0; right:-7px; height:19px; width:19px; background:#34c759; border-bottom-left-radius:16px; }
  .msg-me::after    { content:""; position:absolute; z-index:1; bottom:0; right:-11px; height:19px; width:11px; background:#fff; border-bottom-left-radius:11px; }

  /* Brand mark, bottom-right */
  .brand { position: fixed; right: 30px; bottom: 24px; display: flex; align-items: center; gap: 10px; }
  .brand img { height: 27px; width: auto; }
  .brand span { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: #14181f; }
</style>
</head>
<body>
  <div class="stage">
    <div class="col">
      <div class="caption">Homeowner</div>
      <div class="phone">
        <div class="hdr"><div class="av">A</div><div class="nm">Apex Roofing</div></div>
        <div class="thread" id="thread-home"></div>
      </div>
    </div>
    <div class="col">
      <div class="caption">Contractor</div>
      <div class="phone">
        <div class="hdr"><div class="av">S</div><div class="nm">Sarah &middot; Lead Answered</div></div>
        <div class="thread" id="thread-contr"></div>
      </div>
    </div>
  </div>

  <div class="brand"><img src="./logo.png" alt="Lead Answered" /><span>leadanswered.com</span></div>

<script>
  // Forward: Right / Space / Backspace / Enter / Down. Back: Left / Up. Reload resets.
  // Messages mirror the real system: the contractor phone shows the EXACT owner
  // notifications (qualified lead, booking) + escalation + relay that the code sends.
  const SCRIPT = [
    { phone: "home",  who: "system", text: "Missed Call" },
    { phone: "home",  who: "them",   text: "Hi there! This is Sarah from Apex Roofing. Sorry we missed your call! How can we help you today?" },
    { phone: "home",  who: "me",     text: "Got a roof leak" },
    { phone: "home",  who: "them",   text: "Sorry to hear that. Let's get it taken care of. What's the property address?" },
    { phone: "home",  who: "me",     text: "42 Maple St, Newton, MA 02458" },
    { phone: "home",  who: "them",   text: "One quick thing, are you the homeowner (or the person who'd approve the work)?" },
    { phone: "home",  who: "me",     text: "Yes, it's my place" },
    { phone: "contr", who: "them",   text: "✅ Qualified lead: Caller, roof leak, 02458 (+19788105602)" },
    { phone: "home",  who: "them",   text: "Perfect. I can do a free on-site estimate Tuesday at 9am or Wednesday at 2pm. Which works better?" },
    { phone: "home",  who: "me",     text: "Tuesday at 9 works" },
    { phone: "home",  who: "them",   text: "You're all set for Tuesday, July 7 at 9:00 AM. We'll see you then!" },
    { phone: "contr", who: "them",   text: "📅 New booking: Caller, roof leak @ Tuesday, July 7 at 9:00 AM. 42 Maple St, Newton, MA 02458 (+19788105602)" },
    { phone: "home",  who: "me",     text: "Oh, I was actually referred by my neighbor Bryan. You did his roof last month. He said you could match the price you gave him for his leak." },
    { phone: "home",  who: "them",   text: "Great question! Let me check with the team and I'll be right back with you." },
    { phone: "contr", who: "them",   text: "❓ Caller (+19788105602) asks: they were referred by their neighbor Bryan (we did his roof last month) and want to know if we can match the price we did for Bryan's roof leak.\nReply to this text to answer them." },
    { phone: "contr", who: "me",     text: "Yes, that's true, I told Bryan that. We can match it, but we'll still need to take a look on-site before we finalize." },
    { phone: "home",  who: "them",   text: "Hi Caller! Quick update from Apex Roofing: Yes, that's true, I told Bryan that. We can match it, but we'll still need to take a look on-site before we finalize." },
  ];

  const threads = { home: document.getElementById("thread-home"), contr: document.getElementById("thread-contr") };
  let idx = 0;

  function reveal() {
    if (idx >= SCRIPT.length) return;
    const m = SCRIPT[idx++];
    const t = threads[m.phone];
    if (m.who === "system") {
      const s = document.createElement("div");
      s.className = "sys"; s.textContent = m.text;
      t.appendChild(s);
    } else {
      const row = document.createElement("div");
      row.className = "row " + m.who;
      const b = document.createElement("div");
      b.className = "msg msg-" + m.who; b.textContent = m.text;
      row.appendChild(b); t.appendChild(row);
      requestAnimationFrame(() => b.classList.add("in"));
    }
    t.scrollTop = t.scrollHeight;
  }

  function unreveal() {
    if (idx === 0) return;
    idx--;
    const t = threads[SCRIPT[idx].phone];
    if (t.lastElementChild) t.removeChild(t.lastElementChild);
    t.scrollTop = t.scrollHeight;
  }

  const FORWARD = new Set(["ArrowRight", " ", "Spacebar", "Backspace", "Enter", "ArrowDown"]);
  const BACK = new Set(["ArrowLeft", "ArrowUp"]);
  document.addEventListener("keydown", (e) => {
    if (FORWARD.has(e.key)) { e.preventDefault(); reveal(); }
    else if (BACK.has(e.key)) { e.preventDefault(); unreveal(); }
  });
</script>
</body>
</html>
